<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Calculator</title>

<style>
@font-face {
    font-family: 'CustomFont';
    src: url('./FOT-RodinHimawari Pro UB.otf') format('opentype');
}

body {
    margin: 0;
    background: #121212;
    font-family: 'CustomFont', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.app {
    width: 50vw;
    min-width: 400px;
    max-width: 900px;
    background: #1c1c1c;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(18px, 2vw, 32px);
    color: #bbb;
}

input {
    font-family: inherit;
    font-size: inherit;
    background: #2a2a2a;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    color: white;
    width: 160px;
    text-align: right;
}

.symbol-input {
    text-align: left;
}

.dropdown {
    position: absolute;
    background: #2a2a2a;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: none;
    width: 160px;
}

.dropdown div {
    padding: 10px;
    cursor: pointer;
}

.dropdown div:hover {
    background: #3a3a3a;
}

input:focus {
    outline: 2px solid #7CFF9B;
}

.green {
    color: #7CFF9B;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="app">

<div class="row">Max risk: $<input id="maxRisk" value="400"></div>

<div class="row">Symbol:
<div style="position:relative">
<input id="symbol" class="symbol-input">
<div id="dropdown" class="dropdown"></div>
</div>
</div>

<div class="row">Points risked: <input id="risk" value="50"></div>
<div class="row">Points target: <input id="target" value="75"></div>
<div class="row">Risk-reward: <input id="rr" value="1.5"></div>

<div class="row green">Contracts: <span id="contracts">0</span></div>
<div class="row green">Risk: $<span id="riskAmt">0</span></div>
<div class="row green">Gain: $<span id="gain">0</span></div>

</div>

<script>
const values = { MNQ:2, MES:5, NQ:20, ES:50 };
const symbols = Object.keys(values);

const maxRisk = document.getElementById('maxRisk');
const risk = document.getElementById('risk');
const target = document.getElementById('target');
const rr = document.getElementById('rr');
const symbol = document.getElementById('symbol');
const dropdown = document.getElementById('dropdown');

const contractsEl = document.getElementById('contracts');
const riskAmt = document.getElementById('riskAmt');
const gain = document.getElementById('gain');

// ===== CALC =====
function calc(){
  const sym = symbol.value.toUpperCase();
  if(!values[sym]){
    contractsEl.textContent=0;
    riskAmt.textContent=0;
    gain.textContent=0;
    return;
  }

  const ptVal = values[sym];
  const r = parseFloat(risk.value)||0;
  const t = parseFloat(target.value)||0;
  const max = parseFloat(maxRisk.value)||0;

  if(r>0) rr.value = (t/r).toFixed(2);

  const per = r*ptVal;
  const contracts = per>0?Math.floor(max/per):0;

  contractsEl.textContent=contracts;
  riskAmt.textContent=(contracts*per).toFixed(0);
  gain.textContent=(contracts*t*ptVal).toFixed(0);
}

// ===== INPUT FILTER =====
[maxRisk,risk,target,rr].forEach(el=>{
  el.addEventListener('input',()=>{
    el.value = el.value.replace(/[^0-9.]/g,'');
    if((el.value.match(/\./g)||[]).length>1){
      el.value=el.value.slice(0,-1);
    }
  });
});

// ===== DROPDOWN =====
symbol.addEventListener('focus',()=>{
  dropdown.innerHTML='';
  symbols.forEach(s=>{
    const d=document.createElement('div');
    d.textContent=s;
    d.onclick=()=>{symbol.value=s;save();calc();dropdown.style.display='none';};
    dropdown.appendChild(d);
  });
  dropdown.style.display='block';
});

symbol.addEventListener('input',()=>{
  dropdown.innerHTML='';
  symbols.filter(s=>s.startsWith(symbol.value.toUpperCase()))
  .forEach(s=>{
    const d=document.createElement('div');
    d.textContent=s;
    d.onclick=()=>{symbol.value=s;save();calc();dropdown.style.display='none';};
    dropdown.appendChild(d);
  });
});

window.addEventListener('click', e => {
  if (!e.target.closest('#symbol') && !e.target.closest('#dropdown')) {
    dropdown.style.display = 'none';
  }
});

// also hide on blur (small delay so click can register)
symbol.addEventListener('blur', () => {
  setTimeout(() => {
    dropdown.style.display = 'none';
  }, 100);
});

// ===== NAV =====
const inputs=[maxRisk,symbol,risk,target,rr];

document.addEventListener('keydown',e=>{
  if(e.key!=='Tab'&&e.key!=='Enter')return;
  e.preventDefault();

  const i=inputs.indexOf(document.activeElement);

  if(document.activeElement===symbol){
    const match=symbols.find(s=>s.startsWith(symbol.value.toUpperCase()))||symbols[0];
    symbol.value=match;
    save();
  }

  const next=e.shiftKey?(i-1+inputs.length)%inputs.length:(i+1)%inputs.length;
  inputs[next].focus();
});

inputs.forEach(i=>i.addEventListener('focus',()=>i.select?.()));

// ===== SAVE =====
function save(){
  localStorage.setItem('data',JSON.stringify({
    maxRisk:maxRisk.value,
    symbol:symbol.value,
    risk:risk.value,
    target:target.value,
    rr:rr.value
  }));
}

function load(){
  const d=JSON.parse(localStorage.getItem('data')||'{}');
  if(d.maxRisk) maxRisk.value=d.maxRisk;
  if(d.symbol) symbol.value=d.symbol;
  if(d.risk) risk.value=d.risk;
  if(d.target) target.value=d.target;
  if(d.rr) rr.value=d.rr;
}

// ===== EVENTS =====
document.querySelectorAll('input').forEach(i=>{
  i.addEventListener('input',()=>{save();calc();});
});

load();
calc();

</script>

</body>
</html>
