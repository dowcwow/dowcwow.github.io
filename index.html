    * {
      margin: 0;

    }

    body {
      background-color: #2b2b2b; /* dark gray */

    }

    p {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    body {
      animation: fadeIn 1s ease-in-out;
    }
