<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirby Tournament Manager (Advanced)</title>
    <style>
        :root {
        
            --primary: #ff80ab;
            --secondary: #4fc3f7;
            --accent: #fdd835; /* Star Yellow */
            --bg: #1a1a1a;
            --text: #ffffff;
            --card-bg: #2d2d2d;
            --border: #444;
            --danger: #ef5350;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2, h3 { text-align: center; margin-top: 0; }
        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }

        /* --- Setup Section --- */
        .setup-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            max-width: 800px;
            margin: 0 auto 40px auto;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .setting-group input {
            background: #444;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }

        .btn-start {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-start:hover { filter: brightness(1.1); }

        /* --- Bracket Area --- */
        .bracket-section {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #777;
        }

        .bracket-section.winners { border-left-color: var(--primary); }
        .bracket-section.losers { border-left-color: var(--secondary); }
        .bracket-section.finals { border-left-color: var(--accent); background: rgba(253, 216, 53, 0.1); }

        .race-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .race-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .race-title {
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            padding-bottom: 5px;
            border-bottom: 1px solid #444;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 6px;
            background: #333;
            border-radius: 4px;
        }

        select {
            background: #555;
            color: white;
            border: none;
            padding: 4px;
            border-radius: 3px;
        }

        .btn-next {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            font-size: 18px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }
        .btn-next:hover { transform: scale(1.05); }

        .hidden { display: none; }

        .status-log {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            color: #ccc;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 30px;
            border: 1px solid #333;
        }
        
        .waiting-msg {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px;
        }

        .finals-badge {
            background: var(--accent);
            color: black;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Kirby Air Riders Tournament</h1>

    <div id="setup-area" class="setup-container">
        <h2>Tournament Settings</h2>
        
        <div class="settings-grid">
            <div class="setting-group">
                <label>Max Players per Race</label>
                <input type="number" id="s-max-group" value="6" min="2">
            </div>
            
            <div class="setting-group">
                <label><strong>Winners Bracket:</strong> Top X Advance</label>
                <input type="number" id="s-w-advance" value="1" min="1">
                <small style="color:#777">Ranks 1 to X stay in Winners</small>
            </div>

            <div class="setting-group">
                <label><strong>Winners Bracket:</strong> Drop Threshold</label>
                <input type="number" id="s-w-drop" value="3" min="1">
                <small style="color:#777">Ranks (X+1) to Y drop to Losers. >Y Eliminated.</small>
            </div>

            <div class="setting-group">
                <label><strong>Losers Bracket:</strong> Top X Survive</label>
                <input type="number" id="s-l-survive" value="1" min="1">
                <small style="color:#777">Ranks 1 to X stay. Others Eliminated.</small>
            </div>
        </div>

        <h3>Player Registration</h3>
        <textarea id="player-input" placeholder="Enter names (one per line)..."></textarea>
        
        <button class="btn-start" onclick="startTournament()">Generate Bracket</button>
    </div>

    <div id="game-area" class="hidden">
        
        <div id="bracket-container">
            </div>

        <button class="btn-next" onclick="processRound()">Submit Results</button>

        <div class="status-log" id="status-log">Game Start...</div>
    </div>

    <script>
        // --- Global State ---
        let state = {
            winners: [],
            losers: [],
            round: 1,
            isGrandFinals: false
        };

        let config = {
            maxGroup: 6,
            wAdvance: 1,
            wDrop: 3,
            lSurvive: 1
        };

        // --- Core Logic ---

        function startTournament() {
            // 1. Capture Settings
            config.maxGroup = parseInt(document.getElementById('s-max-group').value);
            config.wAdvance = parseInt(document.getElementById('s-w-advance').value);
            config.wDrop = parseInt(document.getElementById('s-w-drop').value);
            config.lSurvive = parseInt(document.getElementById('s-l-survive').value);

            // 2. Capture Players
            const input = document.getElementById('player-input').value;
            let players = input.split('\n').map(p => p.trim()).filter(p => p !== "");

            if (players.length < 2) {
                alert("Need at least 2 players!");
                return;
            }

            // 3. Initialize
            state.winners = players.sort(() => Math.random() - 0.5);
            state.losers = [];
            state.round = 1;
            state.isGrandFinals = false;

            // 4. Switch UI
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');

            renderRound();
        }

        function renderRound() {
            const container = document.getElementById('bracket-container');
            container.innerHTML = "";
            
            const totalRemaining = state.winners.length + state.losers.length;

            // --- CHECK FOR GRAND FINALS CONDITION ---
            // If total players left can fit in one race, we merge!
            if (!state.isGrandFinals && totalRemaining <= config.maxGroup && state.round > 1) {
                state.isGrandFinals = true;
                // Merge everyone into winners array for the final race
                state.winners = [...state.winners, ...state.losers];
                state.losers = []; 
                logMsg(`--- GRAND FINALS TRIGGERED! ---`);
            }

            if (state.isGrandFinals) {
                const section = document.createElement('div');
                section.className = 'bracket-section finals';
                section.innerHTML = `<h2>🏆 Grand Finals 🏆</h2>`;
                
                // One single race
                const raceDiv = createRaceCard(state.winners, 0, 'finals');
                const flex = document.createElement('div');
                flex.className = 'race-container';
                flex.appendChild(raceDiv);
                section.appendChild(flex);
                
                container.appendChild(section);
                return;
            }

            // --- STANDARD ROUND RENDER ---

            // 1. Winners Bracket
            if (state.winners.length > 0) {
                const wSection = document.createElement('div');
                wSection.className = 'bracket-section winners';
                wSection.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <h2>Winners Bracket</h2>
                        <span>${state.winners.length} Players</span>
                    </div>`;
                
                const wFlex = document.createElement('div');
                wFlex.className = 'race-container';

                if (state.winners.length === 1) {
                    wFlex.innerHTML = `<div class="waiting-msg">1 Player waiting for opponents from Losers Bracket...</div>`;
                } else {
                    const wGroups = balanceGroups(state.winners, config.maxGroup);
                    wGroups.forEach((group, i) => {
                        wFlex.appendChild(createRaceCard(group, i, 'winner'));
                    });
                }
                wSection.appendChild(wFlex);
                container.appendChild(wSection);
            }

            // 2. Losers Bracket
            if (state.losers.length > 0) {
                const lSection = document.createElement('div');
                lSection.className = 'bracket-section losers';
                lSection.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <h2>Losers Bracket</h2>
                        <span>${state.losers.length} Players</span>
                    </div>`;

                const lFlex = document.createElement('div');
                lFlex.className = 'race-container';

                if (state.losers.length === 1) {
                    lFlex.innerHTML = `<div class="waiting-msg">1 Player waiting for opponents to drop down...</div>`;
                } else {
                    const lGroups = balanceGroups(state.losers, config.maxGroup);
                    lGroups.forEach((group, i) => {
                        lFlex.appendChild(createRaceCard(group, i, 'loser'));
                    });
                }
                lSection.appendChild(lFlex);
                container.appendChild(lSection);
            }
        }

        // --- Helper: Create a Race Card UI ---
        function createRaceCard(players, index, type) {
            const card = document.createElement('div');
            card.className = 'race-card';
            
            let titleText = type === 'finals' ? "The Final Race" : `Race ${index + 1}`;
            card.innerHTML = `<div class="race-title">${titleText}</div>`;

            players.forEach(p => {
                const row = document.createElement('div');
                row.className = 'player-row';
                
                let html = `<span>${p}</span>`;
                html += `<select class="res-${type}" data-player="${p}">
                            <option value="0">-</option>`;
                
                // Dropdown options 1..N
                for(let i=1; i<=players.length; i++) {
                    html += `<option value="${i}">${i}</option>`;
                }
                html += `</select>`;
                
                row.innerHTML = html;
                card.appendChild(row);
            });
            return card;
        }

        // --- Helper: Balancing Algorithm ---
        // Converts [13 players] max 6 into -> [5, 4, 4] instead of [6, 6, 1]
        function balanceGroups(players, max) {
            if (players.length <= max) return [players];

            const numRaces = Math.ceil(players.length / max);
            const baseSize = Math.floor(players.length / numRaces);
            const remainder = players.length % numRaces;

            let groups = [];
            let startIndex = 0;

            for (let i = 0; i < numRaces; i++) {
                // Distribute remainder: first 'remainder' groups get +1 player
                let size = baseSize + (i < remainder ? 1 : 0);
                groups.push(players.slice(startIndex, startIndex + size));
                startIndex += size;
            }
            return groups;
        }

        // --- Logic: Process Results ---
        function processRound() {
            let nextWinners = [];
            let nextLosers = []; // Survivors of loser bracket + Dropouts from winner bracket
            
            // Grand Finals Handling
            if (state.isGrandFinals) {
                const inputs = document.querySelectorAll('.res-finals');
                if (!validate(inputs)) return;
                
                // Find rank 1
                let winner = "";
                inputs.forEach(input => {
                    if (input.value === "1") winner = input.dataset.player;
                });
                
                alert(`🎉 TOURNAMENT COMPLETE! 🎉\n\nThe Champion is: ${winner}`);
                return;
            }

            // 1. Process Winners Bracket (if any races happened)
            const wInputs = document.querySelectorAll('.res-winner');
            if (wInputs.length > 0) {
                if (!validate(wInputs)) return;

                // Group inputs by parent race card to enforce uniqueness per race
                // (Validation handled, now processing)
                wInputs.forEach(input => {
                    const rank = parseInt(input.value);
                    const p = input.dataset.player;

                    if (rank <= config.wAdvance) {
                        nextWinners.push(p); // Stay in Winners
                        logMsg(`${p}: Advanced in Winners (Rank ${rank})`);
                    } else if (rank <= config.wDrop) {
                        nextLosers.push(p); // Drop to Losers
                        logMsg(`${p}: Dropped to Losers (Rank ${rank})`);
                    } else {
                        logMsg(`💀 ${p}: Eliminated from Winners (Rank ${rank})`);
                    }
                });
            } else {
                // If only 1 person was waiting, carry them over
                nextWinners = [...state.winners];
            }

            // 2. Process Losers Bracket (if any races happened)
            const lInputs = document.querySelectorAll('.res-loser');
            if (lInputs.length > 0) {
                if (!validate(lInputs)) return;

                lInputs.forEach(input => {
                    const rank = parseInt(input.value);
                    const p = input.dataset.player;

                    if (rank <= config.lSurvive) {
                        nextLosers.push(p); // Survive in Losers
                        logMsg(`${p}: Survived Losers bracket (Rank ${rank})`);
                    } else {
                        logMsg(`💀 ${p}: Eliminated from Losers (Rank ${rank})`);
                    }
                });
            } else {
                // If only 1 person was waiting, carry them over (merged with drops later)
                // We add them to nextLosers now
                state.losers.forEach(p => nextLosers.push(p));
            }

            // Update State
            state.winners = nextWinners;
            state.losers = nextLosers; // This now contains (Old Loser Survivors + New Winner Dropouts)

            // Randomize for next matchups
            state.winners.sort(() => Math.random() - 0.5);
            state.losers.sort(() => Math.random() - 0.5);

            state.round++;
            logMsg(`--- End of Round ${state.round - 1} ---`);
            
            renderRound();
            window.scrollTo(0,0);
        }

        // --- Validation ---
        function validate(nodeList) {
            // Convert to array
            const inputs = Array.from(nodeList);
            
            // Check for empty
            for(let i of inputs) {
                if(i.value === "0") {
                    alert(`Rank missing for ${i.dataset.player}`);
                    return false;
                }
            }

            // Check for duplicates within the same Race Card
            // We do this by looking at the parent element (race-card)
            const cards = new Set(inputs.map(i => i.closest('.race-card')));
            
            for (let card of cards) {
                const cardInputs = card.querySelectorAll('select');
                const values = [];
                for (let sel of cardInputs) {
                    if (values.includes(sel.value)) {
                        alert("Duplicate rank found in a single race! Review inputs.");
                        return false;
                    }
                    values.push(sel.value);
                }
            }

            return true;
        }

        function logMsg(msg) {
            const box = document.getElementById('status-log');
            box.innerHTML = `<div>${msg}</div>` + box.innerHTML;
        }

    </script>
</body>
</html>
